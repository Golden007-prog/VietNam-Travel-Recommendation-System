[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_also = ['if __name__ == "__main__":']
